<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QQQ gegen den 200-Tage-Schnitt</title>
<meta name="color-scheme" content="light dark">
<style>
  :root{
    --bg:#ffffff; --card:#f7f7f8; --line:#e3e3e6;
    --ink:#16161a; --ink2:#55555f; --ink3:#86868f;
    --ok:#1a7f45; --ok-bg:#e9f5ee;
    --warn:#b3471a; --warn-bg:#fdeee7;
    --serie:#2563a8; --sma:#6e6e78; --sma2:#a9772a; --sma3:#9a9aa4;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121214; --card:#1c1c20; --line:#2e2e34;
      --ink:#f1f1f3; --ink2:#b2b2bb; --ink3:#83838d;
      --ok:#4ec47f; --ok-bg:#15291d;
      --warn:#f08a5d; --warn-bg:#2b1a12;
      --serie:#6fa8e0; --sma:#b4b4be; --sma2:#d2a257; --sma3:#86868f;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121214; --card:#1c1c20; --line:#2e2e34;
    --ink:#f1f1f3; --ink2:#b2b2bb; --ink3:#83838d;
    --ok:#4ec47f; --ok-bg:#15291d;
    --warn:#f08a5d; --warn-bg:#2b1a12;
    --serie:#6fa8e0; --sma:#b4b4be; --sma2:#d2a257; --sma3:#86868f;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:640px; margin:0 auto; padding:24px 16px 48px}
  h1{font-size:15px; font-weight:600; color:var(--ink2); margin:0 0 4px; letter-spacing:.01em}
  .lauf{font-size:12.5px; color:var(--ink3); margin:0 0 16px}
  .lauf b{color:var(--ink2); font-weight:600}
  .lauf.alt{color:var(--warn)} .lauf.alt b{color:var(--warn)}
  .zustand{border-radius:14px; padding:20px 18px; margin-bottom:14px; border:1px solid var(--line)}
  .zustand.ok    {background:var(--ok-bg);   border-color:color-mix(in oklab,var(--ok) 35%,transparent)}
  .zustand.unter {background:var(--warn-bg); border-color:color-mix(in oklab,var(--warn) 35%,transparent)}
  .zustand.unklar{background:var(--card)}
  .gross{font-size:34px; font-weight:700; line-height:1.1; letter-spacing:-.02em}
  .ok .gross{color:var(--ok)} .unter .gross{color:var(--warn)}
  .pct{font-size:19px; font-weight:600; margin-top:4px}
  .ok .pct{color:var(--ok)} .unter .pct{color:var(--warn)}
  .zeile{display:flex; justify-content:space-between; gap:12px; padding:7px 0;
         border-top:1px solid var(--line); font-size:14px}
  .zeile:first-of-type{border-top:0}
  .zeile span:first-child{color:var(--ink2)}
  .zeile span:last-child{font-variant-numeric:tabular-nums; font-weight:600}
  .karte{background:var(--card); border:1px solid var(--line); border-radius:14px;
         padding:14px 16px; margin-bottom:14px}
  .karte h2{font-size:13px; font-weight:600; color:var(--ink2); margin:0 0 8px;
            text-transform:uppercase; letter-spacing:.05em}
  ol{margin:0; padding-left:20px} li{margin:5px 0; color:var(--ink2)}
  li b{color:var(--ink)}
  .fuss{font-size:12.5px; color:var(--ink3); margin-top:16px}
  .fuss code{font-size:12px}
  .alarm{background:var(--warn-bg); border:1px solid var(--warn); border-radius:12px;
         padding:12px 14px; margin-bottom:14px; font-size:13.5px; color:var(--ink)}
  .alarm b{color:var(--warn)}
  svg{display:block; width:100%; height:auto}
  .legende{display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--ink2); margin-top:6px}
  .legende i{display:inline-block; width:14px; height:2px; vertical-align:middle; margin-right:5px}
  .spur{display:flex; gap:10px; flex-wrap:wrap; margin-top:7px; font-size:12px;
        color:var(--ink2); font-variant-numeric:tabular-nums}
  .spur span{background:var(--bg); border:1px solid var(--line);
             border-radius:5px; padding:2px 7px}
  .spur b{color:var(--ink3); font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>QQQ gegen den 200-Tage-Schnitt</h1>
  <p class="lauf" id="lauf"></p>
  <div id="inhalt"><div class="karte">Lade &hellip;</div></div>
</div>
<script>
const E = document.getElementById('inhalt');
const n2 = v => (v==null ? '—'
  : v.toLocaleString('de-CH',{minimumFractionDigits:2,maximumFractionDigits:2}));
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ⚠ Wie alt ist die Zahl? Ein Schnitt-Vergleich, der stillschweigend eine
   Woche alt ist, sieht genauso selbstbewusst aus wie ein frischer. Gezaehlt
   werden Werktage; Feiertage kennt die Seite nicht, deshalb eine grosszuegige
   Schwelle statt einer scharfen. */
function werktageSeit(iso){
  const a = new Date(iso + 'T00:00:00Z'), b = new Date();
  let t = 0;
  for (let d = new Date(a); d < b; d.setUTCDate(d.getUTCDate()+1)){
    const w = d.getUTCDay();
    if (w !== 0 && w !== 6) t++;
  }
  return t - 1;
}

/* ⚠ DIE IDENTITAET DER LINIEN HAENGT NICHT AN DER FARBE. Jede traegt ihre
   Beschriftung am rechten Ende, dazu ein eigenes Strichmuster und eine eigene
   Staerke. Vier Hues auseinanderzuhalten ist bei Rot-Gruen-Schwaeche nicht
   verlaesslich — Blau gegen Ocker ist ein sicheres Paar, die beiden Grautoene
   unterscheiden sich zusaetzlich in der Helligkeit. Gleiche Ueberlegung wie
   bei den zwei Gruentoenen der A-Marke im Dashboard.
   ⚠ Der SMA200 ist der DICKSTE der drei Schnitte, weil nur er entscheidet.
   Drei gleich starke Linien waeren drei gleichwertige Signale. */
const LINIEN = [
  { k:'s',    t:'SMA200', farbe:'var(--sma)',  w:2,   dash:'6 4' },
  { k:'s100', t:'SMA100', farbe:'var(--sma2)', w:1.6, dash:'2 3' },
  /* ⚠ Strich-Punkt statt reiner Punkte: '1 3' und '2 3' sahen bei dieser
     Groesse gleich aus, und die beiden Schnitte liegen hier nur $4
     auseinander — dann traegt das Muster die Unterscheidung allein. */
  { k:'s50',  t:'SMA50',  farbe:'var(--sma3)', w:1.6, dash:'5 2 1 2' },
];
function chart(v){
  if (!v || v.length < 5) return '';
  const W = 600, H = 190, P = 8, RECHTS = 58;
  const da = k => v.some(p => p[k] != null);
  const linien = LINIEN.filter(l => da(l.k));
  const alle = v.flatMap(p => [p.c, ...linien.map(l => p[l.k])].filter(z => z != null));
  const lo = Math.min(...alle), hi = Math.max(...alle), sp = (hi - lo) || 1;
  const x = i => P + i * (W - P - RECHTS) / (v.length - 1);
  const y = w => P + (hi - w) / sp * (H - 2*P);
  /* ⚠ Luecken muessen die Linie UNTERBRECHEN, nicht ueberbrueckt werden: am
     linken Rand fehlt dem SMA100 noch der Vorlauf, und eine durchgezogene
     Verbindung ueber die Luecke waere eine erfundene Kursreihe. */
  const pfad = k => {
    let d = '', auf = false;
    v.forEach((p,i) => {
      if (p[k] == null) { auf = false; return; }
      d += (auf ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p[k]).toFixed(1) + ' ';
      auf = true;
    });
    return d.trim();
  };
  /* Beschriftungen duerfen sich nicht ueberlagern: liegen zwei Schnitte dicht
     beieinander, wird die zweite nach unten geschoben. Ohne das werden aus
     zwei Namen ein unlesbarer Klumpen, sobald die Linien sich kreuzen. */
  const belegt = [];
  const platz = yy => {
    let z = Math.min(H-4, Math.max(11, yy+4));
    while (belegt.some(b => Math.abs(b - z) < 11)) z += 11;
    if (z > H-2) z = Math.min(H-2, Math.max(11, yy+4));
    belegt.push(z); return z;
  };
  const letzte = v[v.length-1];
  /* ⚠ DER LAUFENDE TAG WIRD ALS SOLCHER GEZEICHNET. Er haengt an derselben
     Linie — sonst endete die Kurve gestern, waehrend die Karte darueber den
     heutigen Kurs zeigt —, bekommt aber einen OFFENEN Kreis und eine eigene
     Fussnote. Ein vorlaeufiger Punkt, der aussieht wie ein Schlusskurs, ist
     dieselbe Klasse wie „PAUSCHAL 2.5 %": eine Zahl, die mehr behauptet, als
     sie weiss. */
  const vorl = (letzte && letzte.vorlaeufig) ? letzte : null;
  const marke = vorl
    ? '<circle cx="' + x(v.length-1).toFixed(1) + '" cy="' + y(vorl.c).toFixed(1) +
      '" r="3.5" fill="var(--card)" stroke="var(--serie)" stroke-width="2"/>'
    : '';
  const label = (yy, t, farbe) =>
    /* +11 statt +6: der offene Kreis des laufenden Punktes sitzt genau auf
       dem rechten Ende der Kurve und stiess sonst an die Beschriftung. */
    '<text x="' + (W-RECHTS+11) + '" y="' + platz(yy) +
    '" fill="' + farbe + '" font-size="10.5" font-weight="600">' + t + '</text>';
  // Kurs zuerst beschriften — er ist die wichtigste Linie und bekommt den
  // Platz, der ihm wirklich gehoert.
  const lblKurs = label(y(letzte.c), 'QQQ', 'var(--serie)');
  const lblAvg = linien.map(l => label(y(letzte[l.k]), l.t, l.farbe)).join('');
  return '<div class="karte"><h2>Letzte ' + (vorl ? v.length-1 : v.length) +
      ' Handelstage' + (vorl ? ' + heute' : '') + '</h2>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
      'aria-label="QQQ-Schlusskurs gegen 50-, 100- und 200-Tage-Schnitt">' +
      linien.map(l => '<path d="' + pfad(l.k) + '" fill="none" stroke="' + l.farbe +
        '" stroke-width="' + l.w + '" stroke-dasharray="' + l.dash + '"/>').join('') +
      '<path d="' + pfad('c') + '" fill="none" stroke="var(--serie)" stroke-width="2" stroke-linejoin="round"/>' +
      marke + lblKurs + lblAvg +
    '</svg>' +
    '<div class="legende">' +
      '<span><i style="background:var(--serie)"></i>QQQ Schlusskurs</span>' +
      linien.map(l => '<span><i style="background:' + l.farbe + '"></i>' +
        l.t.replace('SMA','') + '-Tage-Schnitt</span>').join('') +
    '</div>' +
    '<div class="fuss" style="margin-top:6px">' + esc(v[0].d) + ' bis ' +
      esc(letzte.d) + (vorl ? ' — der letzte Punkt (○) ist <b>vorläufig</b>: ' +
        'der laufende Kurs, noch kein Schlusskurs.' : '') + '</div></div>';
}

/* ⚠ ZWEI VERSCHIEDENE ZEITPUNKTE, und sie werden leicht verwechselt:
     `geholt`  = wann der Workflow zuletzt LIEF (und Daten schrieb)
     `stand`   = von welchem HANDELSTAG die benutzten Kurse sind
   Am Wochenende laeuft der Cron nicht (Mo–Fr) und die letzte Bar ist die von
   Freitag — beide Zahlen stehen dann still, aus zwei verschiedenen Gruenden.
   Eine gemeinsame Beschriftung wuerde das verwischen.

   ⚠ `geholt` TAUGT als Laufzeit, weil update.py es bei JEDEM Lauf auf die
   aktuelle Uhrzeit setzt: daten.json unterscheidet sich damit nach jedem
   erfolgreichen Lauf, und der Commit kommt. Scheitert der Lauf, bleibt die
   alte Zeit stehen — und genau das soll man hier sehen. */
const uhr = iso => {
  if (!iso) return '?';
  const t = new Date(iso);
  return isNaN(t) ? '?'
    : t.toLocaleTimeString('de-CH', { hour:'2-digit', minute:'2-digit' });
};
function laufzeile(d){
  const el = document.getElementById('lauf');
  if (!el) return;
  if (!d || !d.geholt) { el.textContent = ''; return; }
  const t = new Date(d.geholt);
  if (isNaN(t)) { el.textContent = ''; return; }
  const stunden = (Date.now() - t.getTime()) / 36e5;
  const alter = stunden < 1 ? 'gerade eben'
    : stunden < 24 ? `vor ${Math.round(stunden)} Std`
    : `vor ${Math.round(stunden / 24)} Tagen`;
  /* ⚠ Schwelle 3 Kalendertage, nicht 1: der Cron laeuft Mo–Fr, am Sonntag
     ist der letzte Lauf zwangslaeufig zwei Tage her. Eine Warnung, die jedes
     Wochenende kommt, wird nicht mehr gelesen. */
  const zuAlt = stunden > 72;
  el.className = 'lauf' + (zuAlt ? ' alt' : '');
  const wann = t.toLocaleString('de-CH', { weekday:'short', day:'2-digit',
    month:'2-digit', hour:'2-digit', minute:'2-digit' });
  /* Beide Zeitpunkte nebeneinander, jeder mit eigener Beschriftung. Sie
     getrennt zu halten ist der ganze Zweck: der eine sagt, ob der Abgleich
     noch laeuft, der andere, wie alt die Kurse sind. */
  const tag = d.stand ? d.stand.slice(8,10) + '.' + d.stand.slice(5,7) + '.' : '?';
  let zeile = (zuAlt ? '⚠ ' : '') + 'Zuletzt geprüft <b>' + esc(wann) + '</b> · ' +
    esc(alter) + (zuAlt ? ' — der Abgleich läuft nicht mehr.' : '');
  zeile += ' &nbsp;·&nbsp; Schluss <b>' + esc(tag) + '</b> $' + n2(d.kurs);
  /* ⚠ WAEHREND DER SITZUNG IST DER HEUTIGE TAG NOCH NICHT DABEI. Die letzte
     Bar ist die von GESTERN, und der heutige Kurs ist ein Zwischenstand, auf
     den die Regel nicht angewendet wird. Ohne diesen Zusatz sieht die obere
     Zeile aus, als waeren die Kurse schlicht einen Tag alt — der Unterschied
     zwischen "einen Tag hinterher" und "heute laeuft noch" ist aber genau
     der, auf den es ankommt. */
  if (d.live && d.live.kurs != null) {
    /* ⚠ MIT UHRZEIT. Waehrend des Handelstages ist "von wann" die halbe
       Information — ein Zwischenstand ohne Zeitstempel koennte eine Minute
       oder vier Stunden alt sein, und der Abstand zur Linie liest sich in
       beiden Faellen gleich. */
    const s = d.live.seit_schluss_pct;
    zeile += ' &nbsp;·&nbsp; jetzt <b>' + esc(uhr(d.live.zeit)) + '</b> $' +
      n2(d.live.kurs) +
      (s == null ? '' : ' (<b>' + (s > 0 ? '+' : '') + s.toFixed(2) +
        '&thinsp;%</b> seit Schluss)');
  }
  el.innerHTML = zeile;
  el.title = 'Links: Zeitpunkt des letzten erfolgreichen Workflow-Laufs (' +
    d.geholt + '). Rechts: der Handelstag, aus dem die benutzten Kurse ' +
    'stammen (' + (d.stand || '?') + '). Zwei verschiedene Dinge — am ' +
    'Wochenende stehen beide still, der eine weil der Abgleich Mo–Fr läuft, ' +
    'der andere weil die letzte Bar die von Freitag ist.' +
    (d.live ? ' Die Börse ist gerade offen: der heutige Tag ist noch keine ' +
      'fertige Bar, die Karte rechnet mit dem laufenden Kurs.' : '') +
    ' Werktags läuft der Abgleich um 16:00, 19:00 und 22:40 UTC.';
}

function zeichne(d){
  laufzeile(d);
  const alt = werktageSeit(d.stand);
  /* ⚠ EINE ALTE ZAHL DARF NICHT WIE EINE FRISCHE AUSSEHEN. Ab vier Werktagen
     ohne neue Bar ist etwas kaputt (Workflow, Yahoo, Schreibrecht im Repo) —
     dann steht die Warnung STATT des gruenen oder roten Zustands, nicht
     daneben. Dieselbe Lehre wie "0.0 % Risiko": eine Anzeige ohne Daten ist
     kein Befund. */
  const veraltet = alt >= 4;

  /* ⚠ EINE KARTE, EIN BEZUGSPUNKT. Vorher standen Zustand (Schlusskurs) und
     Zwischenstand (laufender Kurs) in zwei Kacheln untereinander — zwei
     Zahlenpaare fuer dieselbe Frage, und man musste erst herausfinden, welche
     gerade gilt. Jetzt zeigt die Karte waehrend der Sitzung durchgehend den
     LAUFENDEN Kurs, gegen die Schnitte, die sich ergaeben, wenn heute hier
     schliesst; nach Schluss durchgehend die fertige Bar.
     ⚠ Welcher Fall gilt, steht an der Kurszeile ("Intraday 17:52" gegen
     "Schlusskurs") und am Stand. Eine Karte, die beides gleich beschriftet,
     waere die gefaehrlichere Vereinfachung.
     ⚠ Nahe an der Linie koennen Seite und `run_all` dabei verschiedene
     Vorzeichen zeigen — das System entscheidet weiter aus der fertigen Bar.
     Steht in der Fussnote und im README. */
  const live = (!veraltet && d.live && d.live.kurs != null) ? d.live : null;
  const px    = live ? live.kurs              : d.kurs;
  const sma   = live ? live.sma_wenn_schluss  : d.sma;
  const pct   = live ? live.abstand_pct       : d.abstand_pct;
  const ueber = live ? live.ueber             : d.ueber;
  const neben = (live && live.neben) ? live.neben : (d.neben_smas || []);
  /* Gewinn/Verlust gegen den vorherigen SCHLUSSKURS. Waehrend der Sitzung ist
     das der laufende Kurs gegen gestern, nach Schluss die fertige Bar gegen
     die davor. ⚠ "Vortag" ist die vorletzte fertige BAR — am Montag liegt da
     das Wochenende dazwischen, deshalb steht das Datum daneben. */
  const tagPct  = live ? live.seit_schluss_pct : d.tag_pct;
  const tagRef  = live ? d.kurs                : d.vortag_kurs;
  const tagTag  = live ? d.stand               : d.vortag_stand;

  const kl = veraltet ? 'unklar' : (ueber ? 'ok' : 'unter');
  const vz = v => (v > 0 ? '+' : '');
  const dKurz = t => t ? t.slice(8,10) + '.' + t.slice(5,7) + '.' : '?';
  let h = '';
  if (veraltet) h += '<div class="alarm"><b>Diese Zahl ist ' + alt +
    ' Werktage alt.</b> Der letzte Schlusskurs stammt vom ' + esc(d.stand) +
    ', zuletzt geholt am ' + esc((d.geholt||'').slice(0,10)) +
    '. Der Abgleich läuft nicht mehr — bis er wieder läuft, sagt diese Seite ' +
    'nichts über die heutige Lage.</div>';
  h += '<div class="zustand ' + kl + '">' +
    '<div class="gross">' +
      (veraltet ? 'unbekannt' : (ueber ? 'ÜBER der Linie' : 'UNTER der Linie')) +
    '</div>' +
    '<div class="pct">' + (veraltet ? '' : vz(pct) + pct.toFixed(2) + '&thinsp;%') +
      (live ? '<span style="font-size:13px;font-weight:600;color:var(--ink2)">' +
              '&nbsp;&nbsp;intraday</span>' : '') +
    '</div>' +
    '<div style="margin-top:14px">' +
      '<div class="zeile"><span>' + esc(d.symbol) + ' ' +
        (live ? 'Intraday ' + esc(uhr(live.zeit)) : 'Schlusskurs') +
        '</span><span>$' + n2(px) + '</span></div>' +
      /* Gewinn/Verlust gegen den Vortagsschluss — eigene Zeile mit eigener
         Beschriftung. Die Farbe gehoert HIER zur Zahl selbst und nicht zur
         Ampel darueber; ohne Label waeren das zwei Aussagen im selben Feld. */
      (tagPct == null ? '' :
        '<div class="zeile"><span>ggü. Vortag' +
          (tagTag ? ' (' + esc(dKurz(tagTag)) + (tagRef ? ' $' + n2(tagRef) : '') + ')' : '') +
          '</span><span style="color:var(--' + (tagPct >= 0 ? 'ok' : 'warn') + ')">' +
          vz(tagPct) + tagPct.toFixed(2) + '&thinsp;%</span></div>') +
      '<div class="zeile"><span>' + d.sma_n + '-Tage-Schnitt</span>' +
        '<span>$' + n2(sma) + '</span></div>' +
      /* ⚠ NEUTRALE FARBE fuer 50 und 100. Gruen/rot wie oben wuerde sie zu
         einer zweiten Ampel machen — und genau die gibt es nicht: SMA100 als
         Marktfilter ist gemessen deutlich schlechter, und die ODER-Regel mit
         dem SMA50 wurde am 07.11.2026 verworfen. Eine Anzeige, die wie eine
         Vorschrift aussieht, wird als eine gelesen. */
      neben.filter(x => x.sma != null).map(x =>
        '<div class="zeile"><span>' + x.n + '-Tage-Schnitt</span><span>$' + n2(x.sma) +
        '<span style="color:var(--ink3);font-weight:500">&nbsp;&nbsp;' +
        vz(x.abstand_pct) + x.abstand_pct.toFixed(2) + '&thinsp;%</span>' +
        '</span></div>').join('') +
      '<div class="zeile"><span>Stand</span><span>' +
        (live ? esc((live.zeit||'').slice(0,10)) + ', Börse offen'
              : esc(d.stand) + ', Schluss') + '</span></div>' +
      /* Der Tagesverlauf aus den drei Laeufen, mit dem Schlusskurs von gestern
         als Startpunkt. Drei Punkte sind wenig — aber die Frage waehrend des
         Tages lautet "in welche Richtung", und dafuer reicht ein Anfang und
         zwei Zwischenstaende. */
      ((live && (d.live_verlauf||[]).length) ? '<div class="spur">' +
        '<span><b>' + esc(dKurz(d.stand)) + ' Schluss</b> $' + n2(d.kurs) + '</span>' +
        (d.live_verlauf||[]).map(p => '<span>' + esc(uhr(p.ts)) + ' $' +
          n2(p.kurs) + '</span>').join('') +
      '</div>' : '') +
    '</div></div>';
  h += chart(d.verlauf);
  h += '<div class="karte"><h2>' + (d.ueber ? 'Über der Linie gilt' : 'Unter der Linie gilt') +
    '</h2><ol>' + (d.ueber
      ? '<li><b>Normale Kauflogik.</b> Das Kaufbudget ist frei.</li>' +
        '<li><b>Stops stehen fix ab Kauf</b> (3×ATR vom Kauftag).</li>'
      : '<li><b>Nicht kaufen.</b> Das Kaufbudget steht auf $0.</li>' +
        '<li><b>Nicht verkaufen, nichts zusätzlich absichern.</b> Jede Position behält ihren Stop vom Kauftag.</li>' +
        '<li><b>Beim Zurückkreuzen die Stops anheben</b> — auf Kurs jenes Tages minus 3×ATR, einzeln bestätigt.</li>'
    ) + '</ol></div>';
  h += '<div class="fuss">' + esc(d.quelle) + '. Geholt ' +
    esc((d.geholt||'').replace('T',' ').replace('Z',' UTC')) + ', ' + d.bars + ' Bars.<br>' +
    '<b>Nur der ' + d.sma_n + '-Tage-Schnitt entscheidet.</b> 50 und 100 stehen als ' +
    'Kontext da, nicht als zweites Signal: SMA100 als Marktfilter ist über fünf ' +
    'Regime gemessen deutlich schlechter (8.6/6.3/6.9&thinsp;% gegen ' +
    '10.9/10.4/9.7&thinsp;%), und die Regel „kaufen auch wenn SMA50 über SMA200" ' +
    'wurde am 07.11.2026 verworfen (Calmar 0.98 → 0.62, Rückgang in 0 von 5 ' +
    'Fenstern besser).<br>' +
    '<b>Während der Sitzung steht hier der laufende Kurs</b>, gegen die Schnitte, ' +
    'die sich ergäben, wenn heute auf diesem Stand schliesst. Nach Schluss die ' +
    'fertige Tagesbar. Das System entscheidet immer aus der letzten fertigen Bar — ' +
    'nahe an der Linie können diese Seite und <code>run_all</code> deshalb ' +
    'verschiedene Vorzeichen zeigen; massgeblich ist <code>run_all</code>.<br>' +
    'Keine Depotdaten auf dieser Seite — nur öffentliche Marktdaten.</div>';
  E.innerHTML = h;
}

/* ⚠ Selbst parsen statt r.json(): dann laesst sich "Datei kaputt" von "keine
   Datei" unterscheiden. Ein einziges NaN hat am 04.11.2026 eine 18-MB-Datei
   unlesbar gemacht, und beide Dashboards behaupteten dabei etwas Falsches
   ueber die Ursache. */
fetch('daten.json?t=' + Date.now())
  .then(r => r.ok ? r.text() : Promise.reject(new Error('HTTP ' + r.status)))
  .then(t => {
    let d;
    try { d = JSON.parse(t); }
    catch(e){ throw new Error('daten.json ist kein gültiges JSON: ' + e.message); }
    zeichne(d);
  })
  .catch(e => {
    E.innerHTML = '<div class="alarm"><b>Keine Daten.</b> ' + esc(e.message) +
      ' — der GitHub-Action-Lauf hat <code>daten.json</code> noch nie geschrieben, ' +
      'oder die Seite ist nicht veröffentlicht. Diese Seite rechnet nichts selbst.</div>';
  });
</script>
